<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bussola Pizzeria Sorrento</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one phone screen. Timer bar on top, compass inside a wood-oven mouth, shouted order, action row at the thumb. Single dark look by choice: it's used at night, walking. */
:root{
  --oven:#1c130f;     /* ground: inside of the oven */
  --brick:#2c1d16;    /* surfaces */
  --brick-2:#4a3024;  /* rims, rules */
  --dough:#f3e5cc;    /* main text */
  --ash:#a8917f;      /* muted text */
  --ember:#ff6a2a;    /* accent: arrow, button */
  --flame:#ffc24b;    /* arrow tip, timer */
  --late:#ff4438;     /* overtime */
  --late-hi:#ffa08a;
  --basil:#86c46e;    /* arrived */
  --basil-hi:#d4efb8;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --heat:0;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--oven);color:var(--dough);
  font:500 1rem/1.4 var(--body);
  -webkit-tap-highlight-color:transparent;
}
body.late{--ember:var(--late);--flame:var(--late-hi)}
body.arrived{--ember:var(--basil);--flame:var(--basil-hi)}

.app{
  min-height:100%;max-width:520px;margin:0 auto;
  display:flex;flex-direction:column;gap:clamp(10px,2.2vh,20px);
  padding-block:14px 16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.dest{display:grid;gap:3px;min-width:0}
.eyebrow{display:block;font:600 .68rem/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--ash)}
.dest strong{font:900 1.55rem/1 var(--display);text-transform:uppercase;letter-spacing:.01em}
.addr{font-size:.8rem;line-height:1.25;color:var(--ash)}
.clock{display:grid;gap:3px;justify-items:end;flex-shrink:0}
.time{
  font:600 clamp(1.7rem,8.5vw,2.3rem)/1 var(--mono);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--flame);
}
body.late .time{animation:throb 1s steps(2,jump-none) infinite}
@keyframes throb{50%{opacity:.45}}

/* oven + dial */
.oven{flex:1;min-height:0;display:grid;justify-items:center;align-content:center;gap:22px}
.mouth{
  position:relative;width:min(76vw,40vh,330px);max-width:100%;aspect-ratio:1/1.06;
  border-radius:999px 999px 6px 6px;
  background:
    radial-gradient(circle at 50% 60%,
      color-mix(in srgb,var(--ember) calc(10% + 40% * var(--heat)),transparent) 0%,
      transparent 68%),
    var(--brick);
  box-shadow:inset 0 0 0 9px var(--brick-2),inset 0 -40px 50px -30px var(--oven);
  transition:background .6s;
}
.mouth::after{
  content:"";position:absolute;left:-12px;right:-12px;bottom:-9px;height:11px;
  border-radius:3px;background:var(--brick-2);
}
.dial{position:absolute;left:7%;top:6%;width:86%;height:auto;overflow:visible}
.ring{fill:none;stroke:var(--brick-2);stroke-width:2}
.tick{stroke:var(--ash);stroke-width:1.5;opacity:.45}
.tick.major{stroke:var(--dough);stroke-width:2.5;opacity:.8}
.card{fill:var(--ash);font:600 15px var(--mono);text-anchor:middle;dominant-baseline:central}
.card.n{fill:var(--ember);font-size:19px}
.lubber{fill:var(--dough)}
.arrow-shape{fill:url(#arrowGrad);stroke:var(--oven);stroke-width:2.5;stroke-linejoin:round}
.hub{fill:var(--oven);stroke:var(--flame);stroke-width:3}
.dial.idle #arrow{opacity:.3}

.stats{justify-self:stretch;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{display:grid;gap:4px;padding-top:9px;border-top:2px solid var(--brick-2);min-width:0}
.stat b{font:600 1.12rem/1.1 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* the shout */
.shout{
  margin:0;min-height:1em;display:flex;align-items:flex-end;
  font:900 clamp(3rem,17vw,5.4rem)/.91 var(--display);
  text-transform:uppercase;letter-spacing:.005em;text-wrap:balance;
  transform-origin:0 100%;
}
.shout em{font-style:normal;color:var(--ember)}
.shout.pop{animation:pop .42s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(1.16) rotate(-3deg);opacity:0}100%{transform:none;opacity:1}}

/* actions */
.actions{display:grid;gap:10px}
.status{margin:0;font-size:.82rem;line-height:1.3;color:var(--ash);min-height:2.6em}
.btns{display:grid;grid-template-columns:1.35fr 1fr;gap:10px}
.go,.maps{border-radius:10px;min-height:56px;display:grid;place-items:center;text-align:center}
.go{
  font:900 1.45rem/1 var(--display);text-transform:uppercase;letter-spacing:.05em;
  background:var(--ember);color:var(--oven);border:0;padding:12px;cursor:pointer;
}
.go:disabled{background:var(--brick);color:var(--ash);cursor:default}
.maps{
  font:600 .95rem/1.15 var(--body);color:var(--dough);text-decoration:none;
  border:1.5px solid var(--brick-2);padding:10px;
}
.maps:hover{border-color:var(--ash)}
:focus-visible{outline:3px solid var(--flame);outline-offset:3px}

@media (prefers-reduced-motion:reduce){
  .shout.pop,body.late .time{animation:none}
  .mouth{transition:none}
}
</style>

<main class="app">
  <header class="top">
    <div class="dest">
      <span class="eyebrow">Destinazione</span>
      <strong>Pizzeria Sorrento</strong>
      <span class="addr">Via degli Agostiniani 3 · Madonna dell'Olmo, Cuneo</span>
    </div>
    <div class="clock">
      <span class="eyebrow" id="clockLabel">Scade alle 19:30</span>
      <span class="time" id="timer">--:--</span>
    </div>
  </header>

  <section class="oven" aria-label="Direzione verso la pizzeria">
    <div class="mouth">
      <svg class="dial idle" id="dial" viewBox="0 0 300 300" aria-hidden="true">
        <defs>
          <linearGradient id="arrowGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" style="stop-color:var(--flame)"/>
            <stop offset="1" style="stop-color:var(--ember)"/>
          </linearGradient>
          <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="7" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <circle class="ring" cx="150" cy="150" r="140"/>
        <g id="rose"></g>
        <path class="lubber" d="M141 0 L159 0 L150 14 Z"/>
        <g id="arrow" filter="url(#glow)">
          <path class="arrow-shape" d="M150 62 L192 198 L150 171 L108 198 Z"/>
        </g>
        <circle class="hub" cx="150" cy="150" r="9"/>
      </svg>
    </div>

    <div class="stats">
      <div class="stat"><span class="eyebrow">In linea d'aria</span><b id="dist">—</b></div>
      <div class="stat"><span class="eyebrow">Ti servono</span><b id="need">—</b></div>
      <div class="stat"><span class="eyebrow">Stai andando</span><b id="speed">—</b></div>
    </div>
  </section>

  <p class="shout" id="shout"><span><em>Dagliene!</em></span></p>

  <footer class="actions">
    <p class="status" id="status">Tocca Parti: servono posizione e bussola del telefono.</p>
    <div class="btns">
      <button type="button" class="go" id="go">Parti</button>
      <a class="maps" id="maps" target="_blank" rel="noopener"
         href="https://www.google.com/maps/dir/?api=1&amp;destination=44.4191244%2C7.5463183&amp;destination_place_id=ChIJNY5NpZhpzRIRgRBwgL41aXU">Apri in Maps</a>
    </div>
  </footer>
</main>

<script>
(() => {
  const DEST = { lat: 44.4191244, lon: 7.5463183 };
  const DEADLINE = { h: 19, m: 30 };
  const ARRIVE_M = 40;

  const $ = id => document.getElementById(id);
  const els = {
    timer: $('timer'), clockLabel: $('clockLabel'), dist: $('dist'), need: $('need'),
    speed: $('speed'), shout: $('shout'), status: $('status'), go: $('go'),
    rose: $('rose'), arrow: $('arrow'), dial: $('dial')
  };
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- math ---------- */
  const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
  const norm = a => ((a % 360) + 360) % 360;
  const angDiff = (a, b) => ((((a - b) % 360) + 540) % 360) - 180;
  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371000, dφ = rad(lat2 - lat1), dλ = rad(lon2 - lon1);
    const s = Math.sin(dφ / 2) ** 2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dλ / 2) ** 2;
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
  }
  function bearingTo(lat1, lon1, lat2, lon2) {
    const φ1 = rad(lat1), φ2 = rad(lat2), dλ = rad(lon2 - lon1);
    const y = Math.sin(dλ) * Math.cos(φ2);
    const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(dλ);
    return norm(deg(Math.atan2(y, x)));
  }
  const fmt = (n, d = 0) => n.toLocaleString('it-IT', { minimumFractionDigits: d, maximumFractionDigits: d });
  const pad = n => String(n).padStart(2, '0');
  function fmtDist(d) {
    if (d < 1000) return fmt(Math.max(10, Math.round(d / 10) * 10)) + ' m';
    return fmt(d / 1000, d < 10000 ? 1 : 0) + ' km';
  }

  /* ---------- compass card ---------- */
  const NS = 'http://www.w3.org/2000/svg';
  for (let a = 0; a < 360; a += 5) {
    const major = a % 30 === 0, t = rad(a - 90), r1 = major ? 120 : 128, r2 = 138;
    const l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', (150 + r1 * Math.cos(t)).toFixed(2));
    l.setAttribute('y1', (150 + r1 * Math.sin(t)).toFixed(2));
    l.setAttribute('x2', (150 + r2 * Math.cos(t)).toFixed(2));
    l.setAttribute('y2', (150 + r2 * Math.sin(t)).toFixed(2));
    l.setAttribute('class', major ? 'tick major' : 'tick');
    els.rose.appendChild(l);
  }
  [['N', 0], ['E', 90], ['S', 180], ['O', 270]].forEach(([s, a]) => {
    const t = rad(a - 90), tx = document.createElementNS(NS, 'text');
    tx.setAttribute('x', (150 + 105 * Math.cos(t)).toFixed(2));
    tx.setAttribute('y', (150 + 105 * Math.sin(t)).toFixed(2));
    tx.setAttribute('class', s === 'N' ? 'card n' : 'card');
    tx.textContent = s;
    els.rose.appendChild(tx);
  });

  /* ---------- state ---------- */
  const st = {
    started: false, err: null, acc: null, dist: null, bearing: null,
    speed: null, course: null, sensor: null, sensorAt: 0, absSeen: false,
    stillSince: null, lastFix: null, arrived: false, wrong: false
  };

  /* ---------- timer ---------- */
  function deadline() { const t = new Date(); t.setHours(DEADLINE.h, DEADLINE.m, 0, 0); return t.getTime(); }
  const leftMs = () => deadline() - Date.now();
  function clock(ms) {
    const s = ms >= 0 ? Math.ceil(ms / 1000) : Math.floor(-ms / 1000);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return h ? `${h}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
  }
  function tick() {
    const left = leftMs(), late = left < 0;
    document.body.classList.toggle('late', late && !st.arrived);
    els.timer.textContent = (late ? '+' : '') + clock(left);
    els.clockLabel.textContent = late ? 'In ritardo da' : `Scade alle ${DEADLINE.h}:${pad(DEADLINE.m)}`;
    const heat = late ? 1 : Math.max(0, Math.min(1, 1 - left / 3600000));
    document.documentElement.style.setProperty('--heat', heat.toFixed(3));
    renderNeed(left);
  }

  /* ---------- readouts ---------- */
  function renderNeed(left) {
    if (st.dist == null) { els.need.textContent = '—'; return; }
    if (st.arrived) { els.need.textContent = '0 km/h'; return; }
    if (left <= 0) { els.need.textContent = 'subito'; return; }
    const kmh = (st.dist / 1000) / (left / 3600000);
    els.need.textContent = kmh >= 100 ? '99+ km/h' : fmt(kmh, kmh < 10 ? 1 : 0) + ' km/h';
  }
  function renderStats() {
    els.dist.textContent = st.dist == null ? '—' : (st.arrived ? 'Qui' : fmtDist(st.dist));
    els.speed.textContent = st.speed == null ? '—' : fmt(st.speed * 3.6 < 1 ? 0 : st.speed * 3.6) + ' km/h';
    renderNeed(leftMs());
  }

  /* ---------- heading ---------- */
  function screenAngle() {
    if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
    return typeof window.orientation === 'number' ? window.orientation : 0;
  }
  function setSensor(h) { st.sensor = norm(h + screenAngle()); st.sensorAt = Date.now(); }
  function onAbs(e) { if (e.alpha != null) { st.absSeen = true; setSensor(360 - e.alpha); } }
  function onRel(e) {
    if (typeof e.webkitCompassHeading === 'number' && !isNaN(e.webkitCompassHeading)) { setSensor(e.webkitCompassHeading); return; }
    if (e.absolute && e.alpha != null && !st.absSeen) setSensor(360 - e.alpha);
  }
  let listening = false;
  function listenOrientation() {
    if (listening) return;
    listening = true;
    if ('ondeviceorientationabsolute' in window) window.addEventListener('deviceorientationabsolute', onAbs, true);
    window.addEventListener('deviceorientation', onRel, true);
  }
  function heading() {
    if (st.sensor != null && Date.now() - st.sensorAt < 2500) return { h: st.sensor, src: 'sensor' };
    if (st.course != null) return { h: st.course, src: 'course' };
    return { h: 0, src: 'north' };
  }

  /* ---------- animation ---------- */
  let aShown = 0, rShown = 0;
  function frame() {
    const { h } = heading();
    const aT = st.bearing == null ? 0 : st.bearing - h;
    const k = reduce ? 1 : 0.18;
    aShown += angDiff(aT, aShown) * k;
    rShown += angDiff(-h, rShown) * k;
    els.arrow.setAttribute('transform', `rotate(${aShown.toFixed(2)} 150 150)`);
    els.rose.setAttribute('transform', `rotate(${rShown.toFixed(2)} 150 150)`);
    requestAnimationFrame(frame);
  }

  /* ---------- GPS ---------- */
  function onPos(p) {
    const c = p.coords, now = p.timestamp || Date.now();
    st.err = null;
    let spd = (typeof c.speed === 'number' && !isNaN(c.speed)) ? c.speed : null;
    if (spd == null && st.lastFix) {
      const dt = (now - st.lastFix.t) / 1000;
      const moved = haversine(st.lastFix.lat, st.lastFix.lon, c.latitude, c.longitude);
      if (dt >= 1) spd = moved > (c.accuracy || 10) ? moved / dt : 0;
    }
    if (spd != null) st.speed = st.speed == null ? spd : st.speed * 0.5 + spd * 0.5;
    st.lastFix = { lat: c.latitude, lon: c.longitude, t: now };
    st.acc = c.accuracy;
    st.dist = haversine(c.latitude, c.longitude, DEST.lat, DEST.lon);
    st.bearing = bearingTo(c.latitude, c.longitude, DEST.lat, DEST.lon);
    const moving = (st.speed || 0) > 1.2;
    st.course = (moving && typeof c.heading === 'number' && !isNaN(c.heading)) ? c.heading : null;
    if ((st.speed || 0) < 0.6) { if (st.stillSince == null) st.stillSince = Date.now(); }
    else st.stillSince = null;
    st.wrong = st.course != null && st.dist > 150 && Math.abs(angDiff(st.course, st.bearing)) > 110;

    const was = st.arrived;
    st.arrived = st.dist < ARRIVE_M || (was && st.dist < ARRIVE_M * 2);
    document.body.classList.toggle('arrived', st.arrived);
    els.dial.classList.remove('idle');
    renderStats(); renderStatus(); tick();
    if (st.arrived && !was) shoutNow();
  }
  function fail(msg) {
    st.err = msg;
    els.status.textContent = msg;
    els.go.disabled = false;
    els.go.textContent = 'Riprova';
  }
  function onErr(e) {
    if (e && e.code === 1) fail('Posizione bloccata: consenti la localizzazione a questa pagina, oppure usa Maps.');
    else if (st.acc == null) fail("Niente segnale GPS. Esci all'aperto, oppure usa Maps.");
  }
  let watchId = null;
  function startGeo() {
    if (!('geolocation' in navigator)) { fail('Questo browser non dà la posizione. Usa Maps.'); return; }
    if (watchId != null) navigator.geolocation.clearWatch(watchId);
    try {
      watchId = navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
    } catch (e) { fail('Posizione non disponibile qui. Usa Maps.'); }
  }
  function renderStatus() {
    if (!st.started || st.err) return;
    if (st.acc == null) { els.status.textContent = 'Cerco il GPS…'; return; }
    const src = heading().src;
    const comp = src === 'sensor' ? 'bussola attiva'
      : src === 'course' ? 'direzione presa dal movimento'
      : 'senza bussola: la N del quadrante indica il nord';
    els.status.textContent = `GPS ±${Math.round(st.acc)} m · ${comp}. La freccia va in linea d'aria: segui le strade.`;
  }

  /* ---------- screen awake ---------- */
  async function keepAwake() {
    try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && st.started) keepAwake();
  });

  /* ---------- start ---------- */
  els.go.addEventListener('click', async () => {
    els.go.disabled = true;
    els.go.textContent = 'In marcia';
    st.started = true; st.err = null;
    els.status.textContent = 'Cerco il GPS…';
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        const r = await DeviceOrientationEvent.requestPermission();
        if (r === 'granted') listenOrientation();
      } else listenOrientation();
    } catch (e) {}
    startGeo();
    keepAwake();
  });

  /* ---------- the shouting ---------- */
  const WORDS = ['*Dagliene!*', '*Pinnala!*', '*Muoviti!*'];
  function mode() {
    const left = leftMs();
    if (st.arrived) return 'arrived';
    if (st.started && st.dist != null) {
      if (st.dist < 300) return 'near';
      if (st.wrong) return 'wrong';
      if (st.stillSince && Date.now() - st.stillSince > 25000) return left < 0 ? 'late' : 'still';
    }
    if (left < 0) return 'late';
    if (left < 10 * 60000) return 'panic';
    if (left < 30 * 60000) return 'push';
    return 'calm';
  }
  let last = '<em>Dagliene!</em>', shoutTimer = null;
  function shoutNow() {
    clearTimeout(shoutTimer);
    const m = mode(), pool = WORDS;
    let html, guard = 0;
    do {
      html = pool[Math.floor(Math.random() * pool.length)].replace(/\*(.+?)\*/g, '<em>$1</em>');
    } while (pool.length > 1 && html === last && ++guard < 10);
    last = html;
    els.shout.innerHTML = '<span>' + html + '</span>';
    if (!reduce) { els.shout.classList.remove('pop'); void els.shout.offsetWidth; els.shout.classList.add('pop'); }
    const urgent = m === 'panic' || m === 'late' || m === 'wrong' || m === 'still';
    if (st.started && urgent && navigator.vibrate) { try { navigator.vibrate(90); } catch (e) {} }
    shoutTimer = setTimeout(shoutNow, urgent ? 2600 : 4300);
  }

  tick();
  setInterval(tick, 250);
  setInterval(renderStatus, 1000);
  shoutTimer = setTimeout(shoutNow, 3200);
  requestAnimationFrame(frame);
})();
</script>

</body></html>
